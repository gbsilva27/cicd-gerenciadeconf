name: Deploy Main

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g netlify-cli

      - run: |
          netlify deploy \
          --site ${{ secrets.NETLIFY_SITE_ID_MAIN }} \
          --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} \
          --dir . \
          --prod